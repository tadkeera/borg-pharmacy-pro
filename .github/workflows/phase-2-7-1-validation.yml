name: Phase 2.7.1 Production Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-2-7-1-${{ github.ref }}
  cancel-in-progress: true

env:
  # These are repository/environment secrets. Never commit Supabase service-role credentials.
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_SYNC_TOKEN: ${{ secrets.SUPABASE_SYNC_TOKEN }}

jobs:
  compile-unit-build:
    name: Compile, unit tests, and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Compile Kotlin
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Run Phase 2.7.2 acceptance tests
        run: ./gradlew :app:testDebugUnitTest --tests com.borgpharmacy.pro.sync.Phase272AcceptanceTest --no-daemon --stacktrace

      - name: Run primary hospital workflow acceptance gate
        run: ./gradlew :app:testDebugUnitTest --tests com.borgpharmacy.pro.Phase272HospitalWorkflowE2ETest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-7-1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-7-1-build-and-unit-test-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn

  instrumentation:
    name: Android instrumentation and Room migration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: false
          emulator-boot-timeout: 1200
          script: |
            adb devices > adb-devices.log 2>&1
            adb wait-for-device
            BOOTED=0; for i in $(seq 1 240); do BOOT_STATUS="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"; echo "boot-check=$i status=$BOOT_STATUS" | tee -a boot-status.log; if [ "$BOOT_STATUS" = "1" ]; then BOOTED=1; break; fi; sleep 5; done; test "$BOOTED" = "1" || { echo "Emulator did not report sys.boot_completed=1"; exit 1; }
            adb reconnect || true
            adb wait-for-device
            adb devices | tee -a adb-devices.log
            adb devices | grep -Eq '^emulator-5554[[:space:]]+device$' || { echo "emulator-5554 is not online"; exit 1; }
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
            INSTALL_OK=0; for i in 1 2 3; do adb reconnect || true; adb wait-for-device; adb devices | tee -a adb-devices.log; adb install -r -g app/build/outputs/apk/debug/Rep_Visit_v1.0.0-debug.apk && INSTALL_OK=1 && break; sleep 15; done; test "$INSTALL_OK" = "1" || { echo "Debug APK installation failed after 3 attempts"; exit 1; }
            TEST_INSTALL_OK=0; for i in 1 2 3; do adb reconnect || true; adb wait-for-device; adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk && TEST_INSTALL_OK=1 && break; sleep 15; done; test "$TEST_INSTALL_OK" = "1" || { echo "AndroidTest APK installation failed after 3 attempts"; exit 1; }
            adb shell pm clear com.borgpharmacy.pro.debug || true
            adb logcat -c
            adb shell am instrument -w -r com.borgpharmacy.pro.debug.test/androidx.test.runner.AndroidJUnitRunner > instrumentation-raw.log 2>&1; INSTRUMENTATION_EXIT=$?; adb logcat -d > instrumentation-logcat.log; adb shell dumpsys package com.borgpharmacy.pro.debug.test > dumpsys-package.log 2>&1; adb shell dumpsys activity processes > dumpsys-processes.log 2>&1; adb shell pm list packages | grep borg > packages-borg.log 2>&1; grep -nE "FATAL EXCEPTION|AndroidRuntime|Process com.borgpharmacy.pro.debug.test|Process androidx.test.runner|SecurityException|ClassNotFoundException|NoClassDefFoundError|UnsatisfiedLinkError|IllegalStateException" instrumentation-logcat.log instrumentation-raw.log > crash-signatures.log || true; cat instrumentation-raw.log; exit "$INSTRUMENTATION_EXIT"

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-7-1-instrumentation-reports
          path: |
            adb-devices.log
            boot-status.log
            instrumentation-raw.log
            instrumentation-logcat.log
            dumpsys-package.log
            dumpsys-processes.log
            packages-borg.log
            crash-signatures.log
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            **/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: warn

  supabase-staging-security:
    name: Staging Supabase tenant isolation
    runs-on: ubuntu-latest
    # SUPABASE_DB_URL must be configured as a GitHub Actions secret for this job.
    # It must point to a disposable staging database, never production.
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_URL_POOLER: ${{ secrets.SUPABASE_DB_URL_POOLER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate staging secret is present
        run: |
          test -n "$SUPABASE_DB_URL" || {
            echo "SUPABASE_DB_URL is not configured; refusing to run SQL against an unknown database."
            exit 1
          }

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Apply Phase 2.7.1 security migration
        env:
          PGSSLMODE: require
        run: |
          if [ -n "$SUPABASE_DB_URL_POOLER" ]; then
            PSQL_URL="$SUPABASE_DB_URL_POOLER"
          else
            DB_HOST="$(python3 -c 'from urllib.parse import urlsplit; import sys; print(urlsplit(sys.argv[1]).hostname)' "$SUPABASE_DB_URL")"
            DB_IPV4="$(getent ahostsv4 "$DB_HOST" | awk 'NR==1 {print $1}')"
            test -n "$DB_IPV4" || { echo "No IPv4 address found for $DB_HOST and no pooler URL is configured"; exit 1; }
            PSQL_URL="${SUPABASE_DB_URL}?hostaddr=${DB_IPV4}"
          fi
          psql "$PSQL_URL" --set ON_ERROR_STOP=1 --file supabase/schema.sql
          psql "$PSQL_URL" --set ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create table if not exists public.tenants (id uuid primary key default gen_random_uuid(), name text not null, slug text unique, created_at timestamptz not null default now(), updated_at timestamptz not null default now(), is_deleted boolean not null default false);
          create table if not exists public.user_profiles (user_id uuid primary key references auth.users(id) on delete cascade, tenant_id uuid not null references public.tenants(id) on delete cascade, display_name text not null default '', role text not null check (role in ('ADMIN','PHARMACIST')), active boolean not null default true, must_change_password boolean not null default false, created_at timestamptz not null default now(), updated_at timestamptz not null default now());
          alter table public.companies add column if not exists tenant_id uuid;
          alter table public.companies add column if not exists sync_status text not null default 'SYNCED';
          alter table public.companies add column if not exists is_deleted boolean not null default false;
          alter table public.representatives add column if not exists tenant_id uuid;
          alter table public.representatives add column if not exists sync_status text not null default 'SYNCED';
          alter table public.representatives add column if not exists is_deleted boolean not null default false;
          alter table public.visits add column if not exists tenant_id uuid;
          alter table public.visits add column if not exists sync_status text not null default 'SYNCED';
          alter table public.visits add column if not exists is_deleted boolean not null default false;
          create or replace function public.current_tenant_id() returns uuid language sql stable security definer set search_path=public as $$ select tenant_id from public.user_profiles where user_id=auth.uid() and active=true limit 1 $$;
          create or replace function public.current_app_role() returns text language sql stable security definer set search_path=public as $$ select role from public.user_profiles where user_id=auth.uid() and active=true limit 1 $$;
          SQL
          psql "$PSQL_URL" --set ON_ERROR_STOP=1 \
            --file supabase/2026_08_phase_2_7_1_security_foundation.sql
          psql "$PSQL_URL" --set ON_ERROR_STOP=1 --file supabase/2026_08_phase_2_7_2_bootstrap.sql
          psql "$PSQL_URL" --set ON_ERROR_STOP=1 <<'SQL'
          select public.sync_push_test('FACILITY_PROFILE');
          select public.sync_push_test('PRINT_LOG');
          select required_version from public.sync_schema_version where required_version='2.7.2';
          SQL

      - name: Create disposable authenticated tenant fixtures
        env:
          PGSSLMODE: require
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SUPABASE_SERVICE_ROLE_KEY is required for disposable fixture users"; exit 1; }
          USER_A_EMAIL="phase271-a-${GITHUB_RUN_ID}@example.invalid"
          USER_B_EMAIL="phase271-b-${GITHUB_RUN_ID}@example.invalid"
          PASSWORD="Phase271-${GITHUB_RUN_ID}-StrongPassword!"
          create_user() {
            curl --fail-with-body --silent --show-error \
              -X POST "$SUPABASE_URL/auth/v1/admin/users" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              --data "{\"email\":\"$1\",\"password\":\"$PASSWORD\",\"email_confirm\":true}" | jq -r '.id'
          }
          USER_A_ID="$(create_user "$USER_A_EMAIL")"
          USER_B_ID="$(create_user "$USER_B_EMAIL")"
          test -n "$USER_A_ID" -a -n "$USER_B_ID"
          echo "USER_A_ID=$USER_A_ID" >> "$GITHUB_ENV"
          echo "USER_B_ID=$USER_B_ID" >> "$GITHUB_ENV"
          if [ -n "$SUPABASE_DB_URL_POOLER" ]; then
            PSQL_URL="$SUPABASE_DB_URL_POOLER"
          else
            DB_HOST="$(python3 -c 'from urllib.parse import urlsplit; import sys; print(urlsplit(sys.argv[1]).hostname)' "$SUPABASE_DB_URL")"
            DB_IPV4="$(getent ahostsv4 "$DB_HOST" | awk 'NR==1 {print $1}')"
            test -n "$DB_IPV4" || { echo "No IPv4 address found for $DB_HOST and no pooler URL is configured"; exit 1; }
            PSQL_URL="${SUPABASE_DB_URL}?hostaddr=${DB_IPV4}"
          fi
          psql "$PSQL_URL" --set ON_ERROR_STOP=1 \
            --variable user_a_id="$USER_A_ID" --variable user_b_id="$USER_B_ID" <<'SQL'
          insert into public.tenants(id,name,slug) values
            ('00000000-0000-0000-0000-00000000000a','Phase 2.7.1 Tenant A','phase271-a')
            on conflict(id) do update set name=excluded.name;
          insert into public.tenants(id,name,slug) values
            ('00000000-0000-0000-0000-00000000000b','Phase 2.7.1 Tenant B','phase271-b')
            on conflict(id) do update set name=excluded.name;
          insert into public.user_profiles(user_id,tenant_id,display_name,role,active)
            values (:'user_a_id','00000000-0000-0000-0000-00000000000a','Phase Test A','ADMIN',true)
            on conflict(user_id) do update set tenant_id=excluded.tenant_id,role='ADMIN',active=true;
          insert into public.user_profiles(user_id,tenant_id,display_name,role,active)
            values (:'user_b_id','00000000-0000-0000-0000-00000000000b','Phase Test B','ADMIN',true)
            on conflict(user_id) do update set tenant_id=excluded.tenant_id,role='ADMIN',active=true;
          insert into public.companies(id,tenant_id,name,tier,created_at,updated_at)
            values ('10000000-0000-0000-0000-00000000000a','00000000-0000-0000-0000-00000000000a','Tenant A Fixture','UNRATED',0,0)
            on conflict(id) do nothing;
          insert into public.companies(id,tenant_id,name,tier,created_at,updated_at)
            values ('10000000-0000-0000-0000-00000000000b','00000000-0000-0000-0000-00000000000b','Tenant B Fixture','UNRATED',0,0)
            on conflict(id) do nothing;
          SQL

      - name: Execute tenant isolation regression test
        env:
          PGSSLMODE: require
        run: |
          if [ -n "$SUPABASE_DB_URL_POOLER" ]; then
            PSQL_URL="$SUPABASE_DB_URL_POOLER"
          else
            DB_HOST="$(python3 -c 'from urllib.parse import urlsplit; import sys; print(urlsplit(sys.argv[1]).hostname)' "$SUPABASE_DB_URL")"
            DB_IPV4="$(getent ahostsv4 "$DB_HOST" | awk 'NR==1 {print $1}')"
            test -n "$DB_IPV4" || { echo "No IPv4 address found for $DB_HOST and no pooler URL is configured"; exit 1; }
            PSQL_URL="${SUPABASE_DB_URL}?hostaddr=${DB_IPV4}"
          fi
          psql "$PSQL_URL" --set ON_ERROR_STOP=1 \
            --variable user_a_id="$USER_A_ID" \
            --variable user_b_id="$USER_B_ID" \
            --file supabase/tests/tenant_isolation.sql

      - name: Execute live sync contract test
        env:
          PGSSLMODE: require
        run: |
          if [ -n "$SUPABASE_DB_URL_POOLER" ]; then PSQL_URL="$SUPABASE_DB_URL_POOLER"; else DB_HOST="$(python3 -c 'from urllib.parse import urlsplit; import sys; print(urlsplit(sys.argv[1]).hostname)' "$SUPABASE_DB_URL")"; DB_IPV4="$(getent ahostsv4 "$DB_HOST" | awk 'NR==1 {print $1}')"; PSQL_URL="${SUPABASE_DB_URL}?hostaddr=${DB_IPV4}"; fi
          psql "$PSQL_URL" --set ON_ERROR_STOP=1 --variable user_a_id="$USER_A_ID" --variable user_b_id="$USER_B_ID" --file supabase/tests/sync_contract.sql

      - name: Delete disposable fixture users
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${USER_A_ID:-}" ]; then curl --fail-with-body --silent --show-error -X DELETE "$SUPABASE_URL/auth/v1/admin/users/$USER_A_ID" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" || true; fi
          if [ -n "${USER_B_ID:-}" ]; then curl --fail-with-body --silent --show-error -X DELETE "$SUPABASE_URL/auth/v1/admin/users/$USER_B_ID" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" || true; fi

      - name: Upload SQL test log
        if: always()
        run: |
          if [ -n "$SUPABASE_DB_URL_POOLER" ]; then
            PSQL_URL="$SUPABASE_DB_URL_POOLER"
          else
            DB_HOST="$(python3 -c 'from urllib.parse import urlsplit; import sys; print(urlsplit(sys.argv[1]).hostname)' "$SUPABASE_DB_URL")"
            DB_IPV4="$(getent ahostsv4 "$DB_HOST" | awk 'NR==1 {print $1}')"
            PSQL_URL="${SUPABASE_DB_URL}?hostaddr=${DB_IPV4}"
          fi
          psql "$PSQL_URL" --set ON_ERROR_STOP=0 \
            --file supabase/tests/tenant_isolation.sql > supabase-tenant-isolation.log 2>&1 || true

      - name: Upload Supabase verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-7-1-supabase-security-report
          path: supabase-tenant-isolation.log
          if-no-files-found: warn
