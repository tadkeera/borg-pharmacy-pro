name: Phase 3.1 Management Acceptance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x gradlew
      - run: ./gradlew compileDebugKotlin test assembleDebug --no-daemon --stacktrace
  android-repository-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: false
          emulator-boot-timeout: 1200
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
