name: Phase 3.0 Foundation Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase-3-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: Build and Phase 3 foundation unit acceptance
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SYNC_TOKEN: ${{ secrets.SUPABASE_SYNC_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Compile Kotlin
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace
      - name: Run all Phase 3 foundation unit tests
        run: ./gradlew test --no-daemon --stacktrace
      - name: Run named Phase 3 acceptance suites
        run: |
          ./gradlew :app:testDebugUnitTest --tests com.borgpharmacy.pro.phase3.Phase3FoundationE2ETest --no-daemon --stacktrace
          ./gradlew :app:testDebugUnitTest --tests com.borgpharmacy.pro.phase3.Phase3SyncAcceptanceTest --no-daemon --stacktrace
          ./gradlew :app:testDebugUnitTest --tests com.borgpharmacy.pro.phase3.Phase3AuditAcceptanceTest --no-daemon --stacktrace
          ./gradlew :app:testDebugUnitTest --tests com.borgpharmacy.pro.phase3.ReceptionPermitWorkflowE2ETest --no-daemon --stacktrace
          ./gradlew :app:testDebugUnitTest --tests com.borgpharmacy.pro.phase3.Phase3RbacAcceptanceTest --no-daemon --stacktrace
          ./gradlew :app:testDebugUnitTest --tests com.borgpharmacy.pro.phase3.Phase3DatabaseAcceptanceTest --no-daemon --stacktrace
          ./gradlew :app:testDebugUnitTest --tests com.borgpharmacy.pro.phase3.Phase3FoundationFinalE2ETest --no-daemon --stacktrace
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload build and unit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-foundation-build-unit-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  android-instrumentation:
    name: Phase 3 foundation instrumentation acceptance
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SYNC_TOKEN: ${{ secrets.SUPABASE_SYNC_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Run instrumentation tests on clean emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: false
          emulator-boot-timeout: 1200
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-foundation-instrumentation-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: warn

  supabase-phase3-validation:
    name: Supabase Phase 3 foundation validation
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_POOLER }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply Phase 3 foundation schema
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "SUPABASE_DB_URL_POOLER is required"; exit 1; }
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --file supabase/2026_08_phase_3_0_foundation.sql
      - name: Apply Phase 3 foundation migration
        run: psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --file supabase/2026_08_phase_3_0_foundation.sql
      - name: Validate Phase 3 sync schema and tenant scope
        run: |
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if to_regclass('public.facility_visit_authorizations') is null then raise exception 'authorization table missing'; end if;
            if to_regclass('public.entry_permits') is null then raise exception 'permit table missing'; end if;
            if to_regclass('public.employees') is null then raise exception 'employee table missing'; end if;
          end $$;
          SQL
      - name: Upload Supabase validation log
        if: always()
        run: psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=0 -c "select now()" > supabase-phase3.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-3-foundation-supabase-logs
          path: supabase-phase3.log
          if-no-files-found: warn
