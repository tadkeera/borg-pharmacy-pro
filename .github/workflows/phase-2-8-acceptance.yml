name: Phase 2.8 Production Readiness Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: phase-2-8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-security-audit:
    name: Build, security, audit, and unit acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x ./gradlew
      - name: Compile Kotlin
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace
      - name: Unit tests and security/audit acceptance
        run: ./gradlew test --no-daemon --stacktrace
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-2-8-build-unit-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
  android-acceptance:
    name: Android backup, printer, Room, and hospital workflow acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: false
          emulator-boot-timeout: 1200
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-2-8-android-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: warn
