name: Build & Release Rep Visit APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SYNC_TOKEN: ${{ secrets.SUPABASE_SYNC_TOKEN }}
      BORG_KEYSTORE_BASE64: ${{ secrets.BORG_KEYSTORE_BASE64 }}
      BORG_KEYSTORE_PASSWORD: ${{ secrets.BORG_KEYSTORE_PASSWORD }}
      BORG_KEY_ALIAS: ${{ secrets.BORG_KEY_ALIAS }}
      BORG_KEY_PASSWORD: ${{ secrets.BORG_KEY_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Configure release signing
        shell: bash
        run: |
          test -n "$BORG_KEYSTORE_BASE64" || { echo "BORG_KEYSTORE_BASE64 is required for production releases"; exit 1; }
          mkdir -p keystore
          printf '%s' "$BORG_KEYSTORE_BASE64" | base64 --decode > keystore/borg-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/borg-release.jks
          storePassword=$BORG_KEYSTORE_PASSWORD
          keyAlias=$BORG_KEY_ALIAS
          keyPassword=$BORG_KEY_PASSWORD
          EOF

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name 'Rep_Visit_v*.apk' | head -n 1)"
          test -n "$APK_PATH" || { echo "Expected Rep_Visit_v*.apk was not produced"; exit 1; }
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found $APK_PATH"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Rep Visit Release ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          draft: false
          prerelease: false
