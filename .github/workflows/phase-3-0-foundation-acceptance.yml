name: Phase 3.0 Foundation Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase-3-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: Build and Phase 3 foundation unit acceptance
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SYNC_TOKEN: ${{ secrets.SUPABASE_SYNC_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Compile Kotlin
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace
      - name: Run all Phase 3 foundation unit tests
        run: ./gradlew test --no-daemon --stacktrace
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload build and unit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-foundation-build-unit-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  android-instrumentation:
    name: Phase 3 foundation instrumentation acceptance
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SYNC_TOKEN: ${{ secrets.SUPABASE_SYNC_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: actions/setup-android@v3
      - name: Run instrumentation tests on clean emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: false
          emulator-boot-timeout: 1200
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-foundation-instrumentation-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: warn
